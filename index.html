<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字角色卡生成器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>八字角色卡生成器</h1>
  <p class="sub">依据《四柱预测入门》算法 · 输入公历生日生成虚拟角色设定 · 仅供创作参考</p>
</header>

<section class="input-card">
  <div class="row">
    <label>公历生日</label>
    <input type="number" id="inY" min="1900" max="2100" value="1968"> 年
    <input type="number" id="inM" min="1" max="12" value="6"> 月
    <input type="number" id="inD" min="1" max="31" value="1"> 日
  </div>
  <div class="row">
    <label>出生时间</label>
    <input type="number" id="inH" min="0" max="23" value="2"> 时
    <input type="number" id="inMin" min="0" max="59" value="0"> 分
    <span class="hint">（23:00后按次日子时计）</span>
  </div>
  <div class="row">
    <label>性别</label>
    <label class="radio"><input type="radio" name="gender" value="male" checked> 男</label>
    <label class="radio"><input type="radio" name="gender" value="female"> 女</label>
    <button id="btnCalc">生成角色卡</button>
  </div>
  <div id="edgeWarn" class="edge-warn" style="display:none"></div>
</section>

<main id="result" style="display:none">
  <!-- 基础排盘 -->
  <section class="card">
    <h2>八字排盘</h2>
    <table class="sizhu" id="tblSizhu"></table>
    <div class="taiyuan" id="divTaiyuan"></div>
  </section>

  <!-- 圆盘 -->
  <section class="card">
    <h2>五行圆盘 <span class="hint">（点击任一字查看生克关系，再次点击取消）</span></h2>
    <div id="diskBox"></div>
  </section>

  <!-- 角色卡 -->
  <section class="card chara-card">
    <h2>角色设定卡</h2>
    <div id="charaBox"></div>
  </section>
</main>

<footer>
  <p>算法：节气天文算法（Meeus）→ 四柱干支 → 打分法旺衰 → 取用神 → 角色卡生成 · 仅供创作研习，不构成人生指导</p>
</footer>

<script src="js/data.js"></script>
<script src="js/calendar.js"></script>
<script src="js/engine.js"></script>
<script src="js/disk.js"></script>
<script src="js/app.js"></script>
</body>
</html>
